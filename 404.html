<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | Statum</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .not-found { min-height: 100vh; display: grid; place-items: center; padding: 36px; background: var(--paper); text-align: center; }
      .not-found-inner { max-width: 560px; }
      .not-found h1 { margin: 0 auto 22px; font-size: clamp(56px, 10vw, 100px); }
      .not-found p { margin-bottom: 30px; color: var(--ink-soft); font-size: 18px; }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div class="not-found-inner">
        <p class="eyebrow">Statum / 404</p>
        <h1>That page took a <em>wrong turn.</em></h1>
        <p>The page you are looking for is not here. Let's get you back to the work.</p>
        <a class="button button-primary" href="index.html">Back to Statum <span aria-hidden="true">-&gt;</span></a>
      </div>
    </main>
  </body>
</html>
